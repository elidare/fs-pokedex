name: Deployment pipeline

env:
  DEPLOY: ${{ github.event_name == 'push' && !contains(join(toJson(github.event.commits.*.message)), '#skip') }}

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm install
      - name: Check style
        run: npm run eslint
      - name: Run npm build
        run: npm run build

  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  deploy:
    needs: [test]
    runs-on: ubuntu-latest
    outputs:
      deployment_success: ${{ steps.final.outcome == 'success' }}
    steps:
      - if: ${{ env.DEPLOY == 'true' }}
        name: Trigger deployment
        id: final
        run: curl ${{ secrets.RENDER_DEPLOY_HOOK }}

  tag_release:
    needs: [deploy]
    runs-on: ubuntu-latest
    if: ${{ needs.deploy.outputs.deployment_success == 'true' }}
    outputs:
      new_tag: ${{ steps.create_tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Bump version and push tag
        id: create_tag
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8  # Version 1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_PREFIX: v
          DEFAULT_BUMP: patch

  notify_success:
    needs: [deploy, tag_release]
    if: ${{ always() && needs.deploy.result == 'success' && needs.tag_release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Success Notification to discord
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          status: ${{ job.status }}
          content: "✅ Deploy success, version `${{ needs.tag_release.outputs.new_tag }}`"
          title: "Details"
          description: |
            **Commit:** : ${{ github.sha }}
            **Message:** ${{ github.event.head_commit.message }}
            **Author:** ${{ github.actor }}

  notify_failure:
    needs: [deploy, tag_release]
    if: ${{ always() && (needs.deploy.result == 'failure' || needs.tag_release.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Failure notification to discord
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          content: "❌ Deploy failed"
          title: "Details"
          description: |
            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** : [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            **Message:** ${{ github.event.head_commit.message }}
            **Author:** ${{ github.actor }}

            **Deployment:** ${{ needs.deploy.result }}
            **Tag release:** ${{ needs.tag_release.result }}
            **Workflow:** ${{ github.workflow }}
            **Job:** ${{ github.job }}
            **Run**: [View](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
